:root {
  --bg: #303030;

  --border: #555;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  padding: 1rem;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;

header { text-align: center; margin-bottom: 1rem; }
.logo { height: 100px; margin-bottom: 0.5rem; }
h1 { margin: 0; font-size: 1.4rem; letter-spacing: 2px; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin: 0.3rem 0 0.8rem; }
.lang-btns { display: flex; gap: 0.4rem; justify-content: center; margin: 0.8rem 0; }
.lang-btns button {
  background: #444; border: 1px solid var(--border); color: #ddd;
  padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
}
.lang-btns button.active { background: var(--accent); color: #303030; font-weight: 700; }
.menu-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.8rem 0; }
.menu-bar button {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
}
.controls { display: flex; gap: 0.5rem; margin: 0.8rem 0; flex-wrap: wrap; }
input, select {
  background: #3a3a3a; border: 1px solid var(--border); color: var(--text);
  padding: 0.5rem; border-radius: 4px; flex: 1; min-width: 140px;
}
button.primary {
  background: var(--accent); color: #303030; border: none; padding: 0.5rem 1rem;
  border-radius: 4px; cursor: pointer; font-weight: 600;
}
.code-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.8rem; margin: 0.5rem 0; cursor: pointer;
}
.code-card:hover { border-color: #777; }
.code-num { color: var(--accent); font-weight: 700; font-size: 0.85rem; }
.badge { background: #555; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.65rem; margin-left: 0.4rem; }
.opt-badge {
  display: inline-block; background: var(--accent); color: #303030;
  font-weight: 700; font-size: 0.65rem; padding: 0.1rem 0.3rem;
  border-radius: 3px; margin-right: 0.3rem;
}
#detail {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 100; overflow: auto; padding: 1rem;
}
.detail-inner {
  background: #2a2a2a; max-width: 600px; margin: 2rem auto; padding: 1.2rem;
  border-radius: 10px; border: 1px solid var(--border);
}
.close { float: right; background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; }
.disclaimer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 2rem; }
#debug { text-align: center; color: var(--accent); font-size: 0.8rem; margin: 0.5rem 0; }

    <option value="favorites">★ Favoriten</option>
  </select>
  <button class="primary" id="random">🎲 Zufallscode</button>
</div>

<div id="debug"></div>
<div id="list"></div>
<div id="detail"></div>
<div class="disclaimer" id="disclaimer">

</div>

let favorites = [];
try { favorites = JSON.parse(localStorage.getItem("dolphinFavorites") || "[]"); } catch(e) {}

function toggleFavorite(num) {
  const idx = favorites.indexOf(num);
  if (idx === -1) favorites.push(num);
  else favorites.splice(idx, 1);
  localStorage.setItem("dolphinFavorites", JSON.stringify(favorites));
  renderList(document.getElementById("search").value, document.getElementById("category").value);
}

function isFavorite(num) {
  return favorites.includes(num);
}

function renderList(filterText = "", cat = "all") {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = codes.filter(c => {
    // Search across all available languages
    let searchable = "";
    if (c.options) {
      searchable += (c.title?.en || "") + " " + (c.title?.de || "") + " ";
      c.options.forEach(o => {
        Object.values(o).forEach(v => { if (typeof v === "string") searchable += v + " "; });
      });
    } else {
      Object.keys(c).forEach(k => {
        if (k !== "n" && k !== "cat" && k !== "title" && k !== "options" && typeof c[k] === "string") {
          searchable += c[k] + " ";
        }
      });
    }
    const matchText = !filterText || searchable.toLowerCase().includes(filterText.toLowerCase()) || String(c.n).includes(filterText);
    let matchCat = true;
    if (cat === "favorites") {
      matchCat = isFavorite(c.n);
    } else if (cat !== "all") {
      matchCat = c.cat === cat;
    }
    return matchText && matchCat;
  });
  if (!filtered.length) {
    const emptyMsg = {
      de: "Keine Codes gefunden.",
      en: "No codes found.",
      pt: "Nenhum código encontrado.",
      no: "Ingen koder funnet.",
      it: "Nessun codice trovato.",
      nds: "Keen Codes funnen."
    };
    list.innerHTML = `<p style='text-align:center;color:#888'>${emptyMsg[currentLang] || emptyMsg.en}</p>`;
    return;
  }
  filtered.forEach(c => {
    const card = document.createElement("div");
    card.className = "code-card";
    let preview = c.options
      ? (c.title?.[currentLang] || c.title?.en || c.title?.de || "") + " → " + (c.options[0][currentLang]||c.options[0].en||c.options[0].de)
      : (c[currentLang] || c.en || c.de || "");
    if (c.options) {
      const letters = c.options.map(o => o.id).join("");
      preview = `<span class="opt-badge">${letters}</span>` + preview;
    }
    const star = isFavorite(c.n) ? "★ " : "";
    card.innerHTML = `<div class="code-num">${star}DOLPHIN ${c.n} <span class="badge">${c.cat}</span></div><div>${preview.substring(0,160)}${preview.length>160?"…":""}</div>`;
    card.onclick = () => showDetail(c);
    list.appendChild(card);
  });
  document.getElementById("debug").textContent = filtered.length + " Codes";
}

function showDetail(c) {
  const d = document.getElementById("detail");
  d.style.display = "block";
  let html = "";
  if (c.options) {
    const title = c.title?.[currentLang] || c.title?.en || c.title?.de || "";
    html = `<h2>${title}</h2>`;
    c.options.forEach((opt, i) => {
      const label = opt[currentLang] || opt.en || opt.de;
      html += `<label style="display:block;margin:0.5rem 0"><input type="radio" name="option" value="${opt.id}" ${i===0?"checked":""}> <strong>${opt.id}.</strong> ${label}</label>`;
    });
  } else {
    const text = c[currentLang] || c.en || c.de || "";
    html = `<p style="white-space:pre-line;font-size:1.05rem">${text}</p>`;
  }
  const shareBtn = {de:"Teilen", en:"Share", pt:"Partilhar", no:"Del", it:"Condividi", nds:"Deelen"}[currentLang] || "Share";
  const copyBtn = {de:"Kopieren", en:"Copy", pt:"Copiar", no:"Kopier", it:"Copia", nds:"Kopieren"}[currentLang] || "Copy";
  const favBtn = isFavorite(c.n) 
    ? ({de:"★ Entfernen", en:"★ Remove", pt:"★ Remover", no:"★ Fjern", it:"★ Rimuovi", nds:"★ Weg"}[currentLang] || "★ Remove")
    : ({de:"☆ Favorit", en:"☆ Favorite", pt:"☆ Favorito", no:"☆ Favoritt", it:"☆ Preferito", nds:"☆ Favorit"}[currentLang] || "☆ Favorite");
  d.innerHTML = `<div class="detail-inner"><button class="close" onclick="document.getElementById('detail').style.display='none'">×</button><div class="code-num">DOLPHIN ${c.n} ${isFavorite(c.n)?'★':''}</div>${html}<hr style="border-color:#444;margin:1rem 0"><button class="primary" onclick="shareSelected(${c.n})">${shareBtn}</button> <button onclick="copySelected(${c.n})">${copyBtn}</button> <button onclick="toggleFavorite(${c.n}); showDetail(codes.find(x=>x.n===${c.n}))">${favBtn}</button></div>`;
}

function getSignature() {
  if (!profile.rank && !profile.name && !profile.firstname && !profile.nation && !profile.unit) return "";
  const flag = {de:"🇩🇪", nds:"SH", en:"🇬🇧", pt:"🇵🇹", no:"🇳🇴", it:"🇮🇹"}[profile.lang] || "🇩🇪";
  const parts = [profile.rank, `${profile.firstname||""} ${profile.name||""}`.trim(), profile.nation, profile.unit].filter(Boolean);
  return "\n\n" + flag + " " + parts.join(" | ");
}

function getSelectedText(num) {
  const c = codes.find(x => x.n === num);
  if (!c) return "";
  let text = "";
  if (c.options) {
    const sel = document.querySelector('input[name="option"]:checked');
    const optId = sel ? sel.value : c.options[0].id;
    const opt = c.options.find(o => o.id === optId) || c.options[0];
    const title = c.title?.[currentLang] || c.title?.en || "";
    text = `DOLPHIN ${num}${optId}: ${title} ${opt[currentLang]||opt.en||opt.de}`;
  } else {
    text = `DOLPHIN ${num}: ${c[currentLang]||c.en||c.de}`;
  }
  return text + getSignature();
}

function getShareSubject(num) {
  const c = codes.find(x => x.n === num);
  if (!c) return "DOLPHIN CODE";
  if (c.options) {
    const sel = document.querySelector('input[name="option"]:checked');
    const optId = sel ? sel.value : c.options[0].id;
    return `DOLPHIN CODE ${num}${optId}`;
  }
  return `DOLPHIN CODE ${num}`;
}

function shareSelected(num) {
  const text = getSelectedText(num);
  const subject = getShareSubject(num);

  // Plausible Event: Code geteilt (für Ranking und Gesamtzahl)
  if (typeof plausible === "function") {
    plausible("Code Shared", { props: { code: String(num) } });
  }

  if (navigator.share) {
    navigator.share({ title: subject, text }).catch(() => {});
  } else {
    // Fallback nur wenn kein Share-Dialog verfügbar
    const body = encodeURIComponent(text);
    const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${body}`;
    const a = document.createElement("a");
    a.href = mailto;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function copySelected(num) {
  if (typeof plausible === "function") {
    plausible("Code Copied", { props: { code: String(num) } });
  }
  navigator.clipboard.writeText(getSelectedText(num)).then(() => alert("Kopiert"));
}

function showInfo(type) {
  const texts = {
    geschichte: {
      title: {de:"Geschichte", en:"History", nds:"Geschicht", pt:"História", no:"Historie", it:"Storia"},
      content: {
        de:`Im Sommer 1976, tief unter der Meeresoberfläche an Bord der kanadischen Oberon-Klasse U-Boot HMCS Okanagan, entstand etwas, das weit mehr werden sollte als nur ein interner Scherz.<br><br>
Lieutenant Commander Keith Nesbit, damals Kommandant des Bootes, und seine Offiziere hatten monatelang an einem System gearbeitet, das die oft trockenen und steifen Funksprüche zwischen U-Booten, Überwasserschiffen und Flugzeugen auflockern sollte. Das Ergebnis war der Dolphin Code – eine humorvolle, leicht ironische Alternative zum damals verbreiteten Falcon Code der Flieger.<br><br>
Am 2. Juli 1976 schickte Nesbit das fertige Werk offiziell an den Kommandeur der First Canadian Submarine Squadron sowie an die Schwesterboote Ojibwa und Onondaga. In dem Begleitschreiben hieß es sinngemäß: Der Code decke alle Aspekte des U-Boot-Betriebs und der Verwaltung ab und solle den Falcon Code endlich an seinen rechten Platz verweisen. Monate intensiver Arbeit der Okanagan-Offiziere steckten darin.<br><br>
Die Okanagan selbst war in jener Zeit ein Boot mit Charakter. An Bord sprachen Matrosen neben Englisch auch Französisch, Spanisch und sogar Isländisch. Um Oberflächen- und Luftgegner bei Übungen zu verwirren, setzte man unter anderem einen Elektrorasierer in einer Tabaksdose ein, der über das Unterwassertelefon seltsame Geräusche erzeugte. Das Boot trug den Spitznamen „Pandera Rosetta“, und auf der Finne prangte lange Zeit ein Pink Panther. Die beiden Hauptmaschinen tauften die Maschinisten liebevoll BERT und ERNIE – nach den Figuren aus der Sesamstraße.<br><br>
Der Code verbreitete sich rasch über die kanadischen Boote hinaus. Alliierte Einheiten griffen ihn auf, und es kursierten sogar Gerüchte, die sowjetische Marineflieger hätten ihn gelegentlich verwendet. 1997 ergänzte die Royal Australian Navy weitere Nummern (81–175). Heute ist der Dolphin Code in westlichen U-Boot-Marinen bekannt und wird – mit dem nötigen Augenmaß – immer noch genutzt, wenn man etwas sagen will, das man nicht ganz so formell sagen möchte.<br><br>
Die Originalcodes 1 bis 80 stammen von der Okanagan. Alles, was danach kam, sind Ergänzungen späterer Generationen. Der Code bleibt ein Stück Submariner-Kultur: trocken, sarkastisch und immer ein bisschen respektlos gegenüber denen, die über Wasser oder in der Luft unterwegs sind.`,
        en:`In the summer of 1976, deep beneath the surface aboard the Canadian Oberon-class submarine HMCS Okanagan, something was born that would grow far beyond an internal joke.<br><br>
Lieutenant Commander Keith Nesbit, then Commanding Officer of the boat, and his officers had spent months crafting a system to lighten the often dry and stiff radio traffic between submarines, surface ships and aircraft. The result was the Dolphin Code – a humorous, gently ironic alternative to the widely used Falcon Code of the aviators.<br><br>
On 2 July 1976 Nesbit formally sent the finished work to the Commander of the First Canadian Submarine Squadron and to the sister boats Ojibwa and Onondaga. The accompanying letter noted that the code covered all aspects of submarine operations and administration and was intended to put the Falcon Code in its proper place. Months of intensive work by Okanagan’s officers had gone into it.<br><br>
Okanagan herself was a boat with character in those days. Crew members spoke French, Spanish and even Icelandic in addition to English. To confuse surface and air opponents during exercises they used, among other things, an electric razor vibrating inside a tobacco tin transmitted over the underwater telephone. The boat carried the nickname “Pandera Rosetta”, and a Pink Panther was painted on the fin for many years. The two main engines were affectionately named BERT and ERNIE by the stokers – after the Sesame Street characters.<br><br>
The code quickly spread beyond the Canadian boats. Allied units adopted it, and there were even rumours that the Soviet Naval Air Force occasionally used it. In 1997 the Royal Australian Navy added further numbers (81–175). Today the Dolphin Code is known throughout Western submarine navies and is still used – with appropriate care – when one wants to say something that is better left a little less formal.<br><br>
The original codes 1 to 80 come from Okanagan. Everything that followed are additions by later generations. The code remains a piece of submariner culture: dry, sarcastic and always a little disrespectful toward those who travel on the surface or in the air.`,
        nds:`In’n Sommer 1976, deep ünner de See an Boord vun dat kanaadsche Oberon-U-Boot HMCS Okanagan, is wat entstahn, dat mehr warrn schull as blot en internen Spaß.<br><br>
Lieutenant Commander Keith Nesbit, to de Tiet Kommandant vun dat Boot, un sien Offizieren harrn maandenlang an en System arbeit, dat de faken drögen un stieven Funkspröök twischen U-Bööt, Överwaterschippen un Fleegers oplockern schull. Dat Resultat weer de Dolphin Code – en humorvolle, licht ironische Alternativ to’n Falcon Code vun de Fleegers.<br><br>
An’n 2. Juli 1976 schick Nesbit dat fardige Wark offiziell an den Kommandeur vun de First Canadian Submarine Squadron un an de Susterbööt Ojibwa un Onondaga. In’n Begleitbreef stünn, de Code deck all Aspekten vun’n U-Boot-Bedriev un de Verwaltung af un schull den Falcon Code endlich an sien rechten Platz verwiesen. Maanden intensive Arbeit vun de Okanagan-Offizieren steken dorin.<br><br>
De Okanagan sülvst weer to de Tiet en Boot mit Charakter. An Boord snacken Matrosen neben Engelsch ok Franzöösch, Spaansch un sogaar Isländsch. Üm Överwater- un Luftgegner bi Övungen to verwirrn, sett man ünner annern en Elektrorasierer in en Tabaksdoos in, de över dat Ünnerwatertelefon seltsame Geräusche maakt hett. Dat Boot harr den Spitznamen „Pandera Rosetta“, un op de Finne prang lang Tiet en Pink Panther. De beiden Hauptmaschinen dööpt de Maschinisten leev BERT un ERNIE – na de Figuren ut de Sesamstraat.<br><br>
De Code hett sik gau över de kanaadschen Bööt weg verbreet. Alliierte Eenheiten grepen em op, un dat geev sogaar Gerüchte, de sowjetsche Marinefleeger harrn em af un to bruukt. 1997 hett de Royal Australian Navy wietere Nummern (81–175) toföögt. Vandaag is de Dolphin Code in westliche U-Boot-Marinen bekannt un warrt – mit den nöödigen Ogenmaat – jümmer noch bruukt, wenn een wat seggen will, dat een nich ganz so formell seggen mag.<br><br>
De Originalcodes 1 bit 80 kamt vun de Okanagan. Allens, wat dorna keem, sünd Ergänzungen laterer Generationen. De Code blifft en Stück Submariner-Kultur: drög, sarkastisch un jümmer en beten respektlos gegenöver de, de över Water oder in de Luft ünnerwegens sünd.`,
        pt:`No verão de 1976, nas profundezas a bordo do submarino canadiano da classe Oberon HMCS Okanagan, nasceu algo que iria crescer muito para além de uma piada interna.<br><br>
O Tenente-Comandante Keith Nesbit, então Comandante do navio, e os seus oficiais passaram meses a criar um sistema para aliviar as comunicações de rádio frequentemente secas e rígidas entre submarinos, navios de superfície e aeronaves. O resultado foi o Dolphin Code – uma alternativa humorística e ligeiramente irónica ao Falcon Code dos aviadores.<br><br>
A 2 de julho de 1976, Nesbit enviou formalmente o trabalho concluído ao Comandante do First Canadian Submarine Squadron e aos barcos irmãos Ojibwa e Onondaga. A carta que o acompanhava dizia que o código cobria todos os aspectos das operações e administração de submarinos e destinava-se a colocar o Falcon Code no seu devido lugar. Meses de trabalho intensivo dos oficiais da Okanagan estavam nele.<br><br>
A própria Okanagan era um barco com carácter naquela época. A tripulação falava francês, espanhol e até islandês para além do inglês. Para confundir adversários de superfície e aéreos durante exercícios, usavam, entre outras coisas, uma máquina de barbear eléctrica a vibrar dentro de uma lata de tabaco transmitida pelo telefone subaquático. O barco tinha a alcunha “Pandera Rosetta” e um Pink Panther foi pintado na vela durante muitos anos. Os dois motores principais foram carinhosamente batizados de BERT e ERNIE pelos fogueiros – em homenagem às personagens da Rua Sésamo.<br><br>
O código espalhou-se rapidamente para além dos barcos canadianos. Unidades aliadas adotaram-no e até circularam rumores de que a Força Aérea Naval soviética o utilizava ocasionalmente. Em 1997 a Royal Australian Navy acrescentou mais números (81–175). Hoje o Dolphin Code é conhecido nas marinhas de submarinos ocidentais e continua a ser usado – com o devido cuidado – quando se quer dizer algo de forma um pouco menos formal.<br><br>
Os códigos originais 1 a 80 vêm da Okanagan. Tudo o que se seguiu são adições de gerações posteriores. O código permanece um pedaço da cultura submarinista: seco, sarcástico e sempre um pouco desrespeitoso para com aqueles que viajam à superfície ou no ar.`,
        no:`Sommeren 1976, dypt under overflaten om bord på den kanadiske Oberon-klasse-ubåten HMCS Okanagan, ble noe født som skulle vokse langt utover en intern vits.<br><br>
Løytnantkommandør Keith Nesbit, daværende sjef på båten, og offiserene hans hadde brukt måneder på å lage et system som skulle lette den ofte tørre og stive radiokommunikasjonen mellom ubåter, overflateskip og fly. Resultatet ble Dolphin Code – et humoristisk, mildt ironisk alternativ til det mye brukte Falcon Code fra flygerne.<br><br>
2. juli 1976 sendte Nesbit det ferdige verket formelt til sjefen for First Canadian Submarine Squadron og til søsterbåtene Ojibwa og Onondaga. Følgebrevet sa at koden dekket alle aspekter av ubåtoperasjoner og administrasjon og var ment å sette Falcon Code på sin rette plass. Måneder med intensivt arbeid fra Okanagans offiserer lå bak.<br><br>
Okanagan selv var en båt med karakter i de dager. Mannskapet snakket fransk, spansk og til og med islandsk i tillegg til engelsk. For å forvirre overflate- og luftmotstandere under øvelser brukte de blant annet en elektrisk barbermaskin som vibrerte i en tobakksboks og ble sendt over undervannstelefonen. Båten bar kallenavnet «Pandera Rosetta», og en Pink Panther ble malt på finnen i mange år. De to hovedmotorene ble kjærlig døpt BERT og ERNIE av fyrbøterne – etter figurene fra Sesame Street.<br><br>
Koden spredte seg raskt utover de kanadiske båtene. Allierte enheter tok den i bruk, og det gikk til og med rykter om at det sovjetiske marineflyvåpenet brukte den av og til. I 1997 la Royal Australian Navy til flere nummer (81–175). I dag er Dolphin Code kjent i vestlige ubåtmariner og brukes fortsatt – med passende forsiktighet – når man vil si noe som er bedre å si litt mindre formelt.<br><br>
De originale kodene 1 til 80 kommer fra Okanagan. Alt som kom etterpå er tillegg fra senere generasjoner. Koden forblir et stykke ubåtkultur: tørr, sarkastisk og alltid litt respektløs overfor dem som ferdes på overflaten eller i luften.`,
        it:`Nell’estate del 1976, nelle profondità a bordo del sottomarino canadese della classe Oberon HMCS Okanagan, nacque qualcosa che sarebbe cresciuto ben oltre uno scherzo interno.<br><br>
Il Tenente Comandante Keith Nesbit, allora Comandante del battello, e i suoi ufficiali avevano lavorato per mesi a un sistema per alleggerire le comunicazioni radio spesso secche e rigide tra sottomarini, navi di superficie e aerei. Il risultato fu il Dolphin Code – un’alternativa umoristica e leggermente ironica al Falcon Code degli aviatori.<br><br>
Il 2 luglio 1976 Nesbit inviò formalmente l’opera finita al Comandante del First Canadian Submarine Squadron e ai battelli gemelli Ojibwa e Onondaga. La lettera di accompagnamento diceva che il codice copriva tutti gli aspetti delle operazioni e dell’amministrazione dei sottomarini e mirava a mettere il Falcon Code al suo giusto posto. Mesi di lavoro intensivo degli ufficiali dell’Okanagan erano contenuti in esso.<br><br>
La stessa Okanagan era un battello con carattere in quei giorni. L’equipaggio parlava francese, spagnolo e persino islandese oltre all’inglese. Per confondere gli avversari di superficie e aerei durante le esercitazioni usavano, tra le altre cose, un rasoio elettrico che vibrava dentro una scatola di tabacco trasmesso tramite il telefono subacqueo. Il battello portava il soprannome “Pandera Rosetta” e un Pink Panther fu dipinto sulla pinna per molti anni. I due motori principali furono affettuosamente battezzati BERT ed ERNIE dagli addetti alle macchine – dalle figure di Sesame Street.<br><br>
Il codice si diffuse rapidamente oltre i battelli canadesi. Unità alleate lo adottarono e circolarono persino voci che l’aviazione navale sovietica lo usasse occasionalmente. Nel 1997 la Royal Australian Navy aggiunse ulteriori numeri (81–175). Oggi il Dolphin Code è conosciuto nelle marine sottomarine occidentali e viene ancora usato – con la dovuta cautela – quando si vuole dire qualcosa in modo un po’ meno formale.<br><br>
I codici originali da 1 a 80 provengono dall’Okanagan. Tutto ciò che seguì sono aggiunte di generazioni successive. Il codice rimane un pezzo di cultura sommergibilista: secco, sarcastico e sempre un po’ irriverente verso chi viaggia in superficie o in aria.`
      }

        pt:`Agradeço sugestões e feedback construtivos.<br><br>

window.sendFeedback = function() {
  try {
    const subjectEl = document.getElementById("fb-subject");
    const messageEl = document.getElementById("fb-message");
    const subject = subjectEl ? subjectEl.value.trim() : "DOLPHIN CODE RÜCKMELDUNG";
    const message = messageEl ? messageEl.value.trim() : "";
    const sig = getSignature().trim();
    const body = (message || "") + (sig ? "\n\n" + sig : "");
    const mailto = `mailto:alexhub@gmx.net?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    // Zuverlässiger Weg: temporären Link erstellen und klicken
    const a = document.createElement("a");
    a.href = mailto;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    alert("Fehler beim Öffnen der Standard-Mail-App: " + e.message);
  }
};

function showProfile() {
  const d = document.getElementById("detail");
  d.style.display = "block";
  d.innerHTML = `<div class="detail-inner"><button class="close" onclick="document.getElementById('detail').style.display='none'">×</button>
    <h2>Mein Profil</h2>
    <p style="color:#aaa;font-size:0.85rem">Freiwillige Angaben werden als Signatur beim Teilen eingefügt. Die Sprache stellt die App dauerhaft um.</p>
    <label>Dienstgrad<br><input id="p-rank" value="${profile.rank||''}" style="width:100%;margin:0.3rem 0 0.6rem"></label>
    <label>Name<br><input id="p-name" value="${profile.name||''}" style="width:100%;margin:0.3rem 0 0.6rem"></label>
    <label>Vorname<br><input id="p-firstname" value="${profile.firstname||''}" style="width:100%;margin:0.3rem 0 0.6rem"></label>
    <label>Nation<br><input id="p-nation" value="${profile.nation||''}" style="width:100%;margin:0.3rem 0 0.6rem"></label>
    <label>Einheit<br><input id="p-unit" value="${profile.unit||''}" style="width:100%;margin:0.3rem 0 0.6rem"></label>
    <label>Sprache<br><select id="p-lang" style="width:100%;margin:0.3rem 0 0.6rem">
      <option value="de" ${profile.lang==="de"?"selected":""}>🇩🇪 Deutsch</option>
      <option value="nds" ${profile.lang==="nds"?"selected":""}>SH Norddeutsch Platt</option>
      <option value="en" ${profile.lang==="en"?"selected":""}>🇬🇧 English</option>
      <option value="pt" ${profile.lang==="pt"?"selected":""}>🇵🇹 Português</option>
      <option value="no" ${profile.lang==="no"?"selected":""}>🇳🇴 Norsk</option>
      <option value="it" ${profile.lang==="it"?"selected":""}>🇮🇹 Italiano</option>
    </select></label>
    <button class="primary" onclick="saveProfile()" style="width:100%">Speichern</button>
  </div>`;
}

function saveProfile() {
  profile = {
    rank: document.getElementById("p-rank").value.trim(),
    name: document.getElementById("p-name").value.trim(),
    firstname: document.getElementById("p-firstname").value.trim(),
    nation: document.getElementById("p-nation").value.trim(),
    unit: document.getElementById("p-unit").value.trim(),
    lang: document.getElementById("p-lang").value
  };
  localStorage.setItem("dolphinProfile", JSON.stringify(profile));
  if (profile.lang && profile.lang !== currentLang) {
    currentLang = profile.lang;
    initLangButtons();
    updateSubtitle();
    updateMenuLabels();
    renderList();
  }
  alert("Gespeichert");
  document.getElementById("detail").style.display = "none";
}

document.getElementById("search").oninput = e => renderList(e.target.value, document.getElementById("category").value);
document.getElementById("category").onchange = e => renderList(document.getElementById("search").value, e.target.value);
document.getElementById("random").onclick = () => {
  const filterText = document.getElementById("search").value;
  const cat = document.getElementById("category").value;
  const filtered = codes.filter(c => {
    let searchable = "";
    if (c.options) {
      searchable += (c.title?.en || "") + " " + (c.title?.de || "") + " ";
      c.options.forEach(o => {
        Object.values(o).forEach(v => { if (typeof v === "string") searchable += v + " "; });
      });
    } else {
      Object.keys(c).forEach(k => {
        if (k !== "n" && k !== "cat" && k !== "title" && k !== "options" && typeof c[k] === "string") {
          searchable += c[k] + " ";
        }
      });
    }
    const matchText = !filterText || searchable.toLowerCase().includes(filterText.toLowerCase()) || String(c.n).includes(filterText);
    let matchCat = true;
    if (cat === "favorites") {
      matchCat = isFavorite(c.n);
    } else if (cat !== "all") {
      matchCat = c.cat === cat;
    }
    return matchText && matchCat;
  });
  if (filtered.length) {
    showDetail(filtered[Math.floor(Math.random()*filtered.length)]);
  }
};

initLangButtons();
if (profile.lang && ["de","nds","en","pt","no","it"].includes(profile.lang)) currentLang = profile.lang;
updateSubtitle();
updateMenuLabels();
updateCategoryLabels();
updateSearchPlaceholder();
renderList();

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.getElementById("detail").style.display = "none";
  }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "SELECT") {
    e.preventDefault();
    document.getElementById("search").focus();
  }
  if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT") {
    document.getElementById("random").click();
  }
});
let deferredPrompt;
const installBtn = document.getElementById("btn-install");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

if (installBtn) {
  installBtn.addEventListener("click", async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === "accepted") {
        installBtn.style.display = "none";
      }
    } else {
      // Fallback instructions, especially for iOS
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const msg = isIOS
        ? "Auf iOS: Tippe auf das Teilen-Symbol (Quadrat mit Pfeil) und wähle dann „Zum Home-Bildschirm“."
        : "Um die App zum Startbildschirm hinzuzufügen, nutze das Browser-Menü (meist drei Punkte) und wähle „Zum Startbildschirm hinzufügen“ oder „App installieren“.";
      alert(msg);
    }
  });
}

window.addEventListener("appinstalled", () => {
  if (installBtn) installBtn.style.display = "none";
});
</script>
